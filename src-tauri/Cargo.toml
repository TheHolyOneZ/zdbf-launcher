[package]
name = "zdbf-launcher"
version = "0.1.0"
description = "ZSync ZDBF V2 Launcher"
authors = ["TheHolyOneZ"]
license = "Apache-2.0"
repository = "https://github.com/TheHolyOneZ/zdbf-launcher"
edition = "2024"
rust-version = "1.90"

[lib]
name = "zdbf_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset", "system-proxy"] }
toml_edit = "0.25"
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
semver = "1"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
